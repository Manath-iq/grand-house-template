name: Демо на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Демо всегда одно. Новый запуск отменяет очередь, но начавшийся деплой
# доводится до конца, иначе страница останется обновлённой наполовину.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Идёт до сборки: из его выводов берутся адрес сайта и префикс пути.
      #
      # Без enablement: true. Токену workflow не хватает прав создать сайт
      # Pages, и шаг падает с «Resource not accessible by integration».
      # Pages включается один раз снаружи:
      #   gh api -X POST repos/<owner>/<repo>/pages -f build_type=workflow
      # Для своего домена он отдаёт origin = https://grandhouse.manath.site
      # и base_path пустой строкой. Пустую строку обрабатывает astro.config —
      # там она означает корень, а не «значение не задано».
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}

      # В dist попадает public/CNAME. Файл обязателен: указание домена
      # в настройках Pages один раз уже переключило build_type обратно
      # на legacy, и домен начал отдавать страницу, собранную Jekyll
      # из README, вместо сайта. CNAME в артефакте закрепляет домен
      # за деплоем и не требует лазить в настройки руками.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
